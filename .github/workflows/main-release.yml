# Runs only after a merge to main.
# test -> build signed Android APK/AAB -> artifacts -> (new version?) tag + GitHub Release -> (Play configured?) upload.
name: main-release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-release
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: |
          flutter pub get
          (cd packages/wcalc_engine && dart pub get && dart test)
          flutter test

  android:
    name: build-android
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Read version
        id: version
        run: |
          VERSION=$(grep -E '^version:' pubspec.yaml | sed -E 's/version:[[:space:]]*//; s/\+.*//')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version $VERSION, build number ${{ github.run_number }}"

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.WCALC_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "WCALC_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No signing secrets. Building with DEBUG signature (not installable over a release build, not uploadable to Play)."
          fi

      - name: Build APKs and AAB
        env:
          WCALC_KEYSTORE_PASSWORD: ${{ secrets.WCALC_KEYSTORE_PASSWORD }}
          WCALC_KEY_ALIAS: ${{ secrets.WCALC_KEY_ALIAS }}
          WCALC_KEY_PASSWORD: ${{ secrets.WCALC_KEY_PASSWORD }}
        run: |
          flutter pub get
          ARGS="--release --build-number=${{ github.run_number }}"
          flutter build apk $ARGS
          flutter build apk $ARGS --split-per-abi
          flutter build appbundle $ARGS
          V=${{ steps.version.outputs.version }}
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk "dist/w-calc-$V-universal.apk"
          for f in build/app/outputs/flutter-apk/app-*-release.apk; do
            abi=$(basename "$f" | sed -E 's/app-(.*)-release.apk/\1/')
            cp "$f" "dist/w-calc-$V-$abi.apk"
          done
          cp build/app/outputs/bundle/release/app-release.aab "dist/w-calc-$V.aab"
          (cd dist && sha256sum * > SHA256SUMS.txt)
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: w-calc-android-${{ steps.version.outputs.version }}-build${{ github.run_number }}
          path: dist/
          retention-days: 30

  release:
    name: release
    needs: android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new: ${{ steps.check.outputs.new }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Is this a new version?
        id: check
        env:
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "new=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$VERSION already exists. Artifacts built, no release."
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/download-artifact@v8
        if: steps.check.outputs.new == 'true'
        with:
          name: w-calc-android-${{ needs.android.outputs.version }}-build${{ github.run_number }}
          path: dist

      - name: Extract release notes from CHANGELOG
        if: steps.check.outputs.new == 'true'
        env:
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[?"v"\\]?" {on=1; next}
            on && /^## / {exit}
            on {print}
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Release v$VERSION" > notes.md
          cat notes.md

      - name: Tag and publish GitHub Release
        if: steps.check.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.android.outputs.version }}
        run: |
          PRE=""
          [[ "$VERSION" == *-* ]] && PRE="--prerelease"
          gh release create "v$VERSION" dist/* \
            --target "$GITHUB_SHA" \
            --title "W-Calc v$VERSION" \
            --notes-file notes.md $PRE

  play:
    name: play-internal
    needs: [android, release]
    if: needs.release.outputs.new == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Check Play configuration
        id: cfg
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$PLAY_JSON" ]; then echo "enabled=true" >> "$GITHUB_OUTPUT";
          else echo "::notice::Play upload skipped (PLAY_SERVICE_ACCOUNT_JSON not set)."; fi

      - uses: actions/download-artifact@v8
        if: steps.cfg.outputs.enabled == 'true'
        with:
          name: w-calc-android-${{ needs.android.outputs.version }}-build${{ github.run_number }}
          path: dist

      - uses: r0adkll/upload-google-play@v1
        if: steps.cfg.outputs.enabled == 'true'
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: io.github.winzerprince.wcalc
          releaseFiles: dist/*.aab
          track: internal
          status: draft
