# Fast gate for feature branches -> dev.
# Minimal: format, analyze, unit/widget tests. No builds, no artifacts.
name: dev-checks

on:
  pull_request:
    branches: [dev]

concurrency:
  group: dev-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.9"

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: |
          flutter pub get
          (cd packages/wcalc_engine && dart pub get)

      - name: Format
        run: dart format --output=none --set-exit-if-changed lib test packages

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/wcalc_engine && dart analyze --fatal-infos)

      - name: Engine tests
        working-directory: packages/wcalc_engine
        run: dart test

      - name: App tests
        run: flutter test
