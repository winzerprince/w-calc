# PRs into dev: instant placeholder so the required "checks" status reports.
# Full verification (format, analyze, all tests) runs locally before every PR
# (see CLAUDE.md) and in CI on dev -> main (main-gate). Builds run only on main.
# Kept minimal on purpose to save GitHub Actions minutes and development time.
name: dev-checks

on:
  pull_request:
    branches: [dev]

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - run: echo "Local gates are required before PRs to dev; full CI runs on dev -> main."
