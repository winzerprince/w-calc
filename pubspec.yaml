name: w_calc
description: "W-Calc: scientific calculator"
publish_to: 'none'

# Release version. Bump on `dev` via PR; merging to `main` creates tag v<version-without-build>.
# Build number (+N) is overridden in CI by the workflow run number.
version: 0.12.0-beta+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3
  wcalc_engine:
    path: packages/wcalc_engine
  web: ^1.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Licence texts shown on Menu ▸ About ▸ Third-party licences.
  assets:
    - assets/fonts/OFL.txt
    - assets/fonts/OFL-PatrickHand.txt

  # Bundled fonts: the app must never fetch fonts at runtime (offline, no network).
  # Barlow Semi Condensed: SIL OFL 1.1 (assets/fonts/OFL.txt).
  # WCalcSymbols: subset of Noto Sans Math, SIL OFL 1.1.
  fonts:
    - family: Barlow
      fonts:
        - asset: assets/fonts/BarlowSemiCondensed-Medium.ttf
          weight: 500
        - asset: assets/fonts/BarlowSemiCondensed-Bold.ttf
          weight: 700
    - family: WCalcSymbols
      fonts:
        - asset: assets/fonts/WCalcSymbols.ttf
    # Patrick Hand: SIL OFL 1.1 (assets/fonts/OFL-PatrickHand.txt); tour notes.
    - family: Hand
      fonts:
        - asset: assets/fonts/PatrickHand-Regular.ttf
